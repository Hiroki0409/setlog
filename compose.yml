name: setlog

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env first}
      MYSQL_DATABASE: setlog_development
      MYSQL_USER: setlog
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u setlog -D setlog_development -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USERNAME: setlog
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  bundle_data:
